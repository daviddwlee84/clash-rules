name: Validate and publish rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install locked YAML parser
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, urllib.request
          lock = json.loads(pathlib.Path('tooling.lock.json').read_text())['yaml_parser']
          data = urllib.request.urlopen(lock['url'], timeout=45).read()
          if hashlib.sha256(data).hexdigest() != lock['sha256']:
              raise SystemExit('YAML parser checksum mismatch')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'clash-tools'
          directory.mkdir()
          path = directory / 'yq'
          path.write_bytes(data)
          path.chmod(0o700)
          with open(os.environ['GITHUB_PATH'], 'a') as out:
              out.write(str(directory) + '\n')
          PYTHON
      - name: Unit and offline build checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --check
          python3 scripts/publish.py
      - name: Pinned native Mihomo fixture
        run: python3 scripts/native_check.py --download

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rules-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Preserve release history and create immutable artifact tag
        run: python3 scripts/publish.py --publish
